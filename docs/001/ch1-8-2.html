<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>线索解码</title>
    <style>
        html, body {
            min-height: 100%;
        }
        body {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: 50px 20px;
            display: grid;
            place-items: center;
            text-align: center;
            font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #3f3925 url("../background.jpg") center / cover no-repeat;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(20, 16, 8, 0.58);
        }
        body > * {
            position: relative;
            z-index: 1;
        }
        #end-message {
            box-sizing: border-box;
            width: min(900px, 100%);
            color: white;
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 600;
            line-height: 1.55;
            padding: clamp(22px, 5vw, 44px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            background: rgba(17, 13, 7, 0.84);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px black;
        }
        .clue-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .clue-image { display: block; max-width: 100%; height: auto; margin: 24px auto 0; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="end-message">
<div class="clue-text" id="clue-text">在右上角、右下角，左上角，左下角中回答一个</div>

    </div>

    <script>
        const clue = document.getElementById('clue-text');
        if (clue) {
            const original = clue.textContent;
            const chars = Array.from(original);
            const total = chars.filter(char => !/\s/u.test(char)).length;
            const randomHan = actual => {
                let char;
                do { char = String.fromCodePoint(0x4e00 + Math.floor(Math.random() * (0x9fff - 0x4e00 + 1))); }
                while (char === actual);
                return char;
            };
            const start = performance.now();
            let timer;
            // Keep the original accessible text stable while the visual glyphs change.
            clue.setAttribute('aria-label', original);
            function update() {
                const solved = Math.floor((performance.now() - start) / 200);
                let index = 0;
                clue.textContent = chars.map(char => /\s/u.test(char) ? char : (++index <= solved ? char : randomHan(char))).join('');
                if (solved >= total) {
                    clue.textContent = original;
                    clearInterval(timer);
                }
            }
            if (total) {
                timer = setInterval(update, 50);
                update();
            }
        }
    </script>
</body>
</html>
