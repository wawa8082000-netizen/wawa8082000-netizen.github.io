<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>线索解码</title>
    <style>
        html, body {
            min-height: 100%;
        }
        body {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: 50px 20px;
            display: grid;
            place-items: center;
            text-align: center;
            font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #3f3925 url("../background.jpg") center / cover no-repeat;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(34, 31, 19, 0.32);
        }
        body > * {
            position: relative;
            z-index: 1;
        }
        #end-message {
            box-sizing: border-box;
            width: min(900px, 100%);
            color: #403729;
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 500;
            font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
            line-height: 1.8;
            padding: clamp(30px, 5vw, 56px);
            border: 1px solid #9c865e;
            border-radius: 2px;
            background: linear-gradient(120deg, #f4eddcf7, #e9ddc6fa);
            box-shadow: 0 18px 55px #362b2440, inset 0 0 42px #b49a6420;
            text-shadow: none;
        }
        #end-message::before {
            content: ""; position: absolute; inset: 8px;
            border: 1px solid #ae976857; pointer-events: none;
        }
        #end-message::after {
            content: ""; position: absolute; inset: 6px; pointer-events: none;
            background:
                linear-gradient(#9c865e, #9c865e) left top / 20px 2px no-repeat,
                linear-gradient(#9c865e, #9c865e) left top / 2px 20px no-repeat,
                linear-gradient(#9c865e, #9c865e) right top / 20px 2px no-repeat,
                linear-gradient(#9c865e, #9c865e) right top / 2px 20px no-repeat,
                linear-gradient(#9c865e, #9c865e) left bottom / 20px 2px no-repeat,
                linear-gradient(#9c865e, #9c865e) left bottom / 2px 20px no-repeat,
                linear-gradient(#9c865e, #9c865e) right bottom / 20px 2px no-repeat,
                linear-gradient(#9c865e, #9c865e) right bottom / 2px 20px no-repeat;
        }
        .decode-char[data-pending="true"] { color: #99958b; }
        .clue-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .decode-char { display: inline-block; width: 1em; text-align: center; vertical-align: baseline; white-space: pre; }
        .image-frame {
            display: block; position: relative; box-sizing: border-box;
            width: 100%;
        }
        .clue-text + .image-frame { margin-top: 26px; }
        .image-frame:focus-visible { outline: 2px solid #806642; outline-offset: 5px; }
        .clue-image {
            display: block; width: auto; max-width: 100%; height: auto;
            max-height: 85vh; margin: 0 auto; object-fit: contain;
            mix-blend-mode: multiply;
            filter: blur(24px);
            -webkit-mask-image: linear-gradient(to right, transparent, #000 8px, #000 calc(100% - 8px), transparent), linear-gradient(to bottom, transparent, #000 8px, #000 calc(100% - 8px), transparent);
            -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to right, transparent, #000 8px, #000 calc(100% - 8px), transparent), linear-gradient(to bottom, transparent, #000 8px, #000 calc(100% - 8px), transparent);
            mask-composite: intersect;
        }
    </style>
</head>
<body>
    <div id="end-message">
<div class="clue-text" id="clue-text">永定门的位置在其彩画背面的地图中已经标出，据此，找到图中那个红色符号的位置并前往。 </div>

    </div>


    <script>
        const clue = document.getElementById('clue-text');
        if (clue) {
            const original = clue.textContent;
            const chars = Array.from(original);
            const isLineBreak = char => /^[\n\r\u2028\u2029]$/u.test(char);
            const total = chars.filter(char => !isLineBreak(char)).length;
            const cluePool = Array.from(new Set(chars.filter(char => !/\s/u.test(char))));
            const commonHan = Array.from(new Set('天地日月山水风云雨雪星光东南西北春夏秋冬上下左右前后中大小多少长短高低远近开关出入来去人心手足眼耳口门文字书画纸笔石木金火土城桥楼路河海花草树叶红黄蓝白黑青明暗清新古今时年分秒一二三四五六七八九十百千万天地之间寻找发现线索秘密答案位置方向顺序数字图形颜色声音时间空间故事记忆现场观察对照连接组合完整还原真实变化开始结束继续等待看见知道得到可以我们你们他们这里那里一个两个每个所有没有不同相同一起因为所以如果然后最后首先东西地方世界生活学习工作朋友家园平安快乐希望梦想勇气智慧探索行动选择成功重要特别简单自然美好山川大地城市街道历史文化知识语言文字问题方法结果过程目标路径地图调查记录标记符号内容信息关系中心边界远方回声消息重现通往过去未来'));
            const symbols = Array.from('0123456789+-=*/%#@&!?<>[]()');
            const randomHan = actual => {
                const choice = Math.random();
                const pool = choice < 0.2 ? symbols : choice < 0.5 && cluePool.length ? cluePool : commonHan;
                const candidates = pool.filter(char => char !== actual);
                const available = candidates.length ? candidates : commonHan.filter(char => char !== actual);
                return available[Math.floor(Math.random() * available.length)];
            };
            const cells = chars.map(char => {
                if (/^[\n\r\u2028\u2029]$/u.test(char)) return document.createTextNode(char);
                const cell = document.createElement('span');
                cell.className = 'decode-char';
                cell.textContent = char;
                cell.setAttribute('aria-hidden', 'true');
                return cell;
            });
            clue.replaceChildren(...cells);
            const start = performance.now();
            let timer;
            // Keep the original accessible text stable while the visual glyphs change.
            clue.setAttribute('aria-label', original);
            function update() {
                const solved = Math.floor((performance.now() - start) / 200);
                let index = 0;
                chars.forEach((char, i) => {
                    const pending = !isLineBreak(char) && ++index > solved;
                    cells[i].textContent = pending ? randomHan(char) : char;
                    if (cells[i].setAttribute) cells[i].setAttribute('data-pending', String(pending));
                });
                if (solved >= total) {
                    clearInterval(timer);
                }
            }
            if (total) {
                timer = setInterval(update, 50);
                update();
            }
        }
    </script>
</body>
</html>
