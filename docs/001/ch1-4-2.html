<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>线索解码</title>
    <style>
        html, body {
            min-height: 100%;
        }
        body {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: 50px 20px;
            display: grid;
            place-items: center;
            text-align: center;
            font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #3f3925 url("../background.jpg") center / cover no-repeat;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(20, 16, 8, 0.58);
        }
        body > * {
            position: relative;
            z-index: 1;
        }
        #end-message {
            box-sizing: border-box;
            width: min(900px, 100%);
            color: white;
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 600;
            line-height: 1.55;
            padding: clamp(22px, 5vw, 44px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            background: rgba(17, 13, 7, 0.84);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px black;
        }
        .clue-text { white-space: pre-wrap; overflow-wrap: anywhere; }
        .decode-char { display: inline-block; width: 1em; text-align: center; vertical-align: baseline; white-space: pre; }
        .clue-image { display: block; max-width: 100%; height: auto; margin: 24px auto 0; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="end-message">
<div class="clue-text" id="clue-text">你会发现，有一张明信片上绘有这座建筑，这是一座钟楼，但是明信片上的钟面缺失了，画面顶部的碎片正是缺失的钟面。每一个碎片都对应了一个数字。</div>

    </div>

    <script>
        const clue = document.getElementById('clue-text');
        if (clue) {
            const original = clue.textContent;
            const chars = Array.from(original);
            const total = chars.filter(char => !/\s/u.test(char)).length;
            const commonHan = Array.from(new Set('天地日月山水风云雨雪星光东南西北春夏秋冬上下左右前后中大小多少长短高低远近开关出入来去人心手足眼耳口门文字书画纸笔石木金火土城桥楼路河海花草树叶红黄蓝白黑青明暗清新古今时年分秒一二三四五六七八九十百千万天地之间寻找发现线索秘密答案位置方向顺序数字图形颜色声音时间空间故事记忆现场观察对照连接组合完整还原真实变化开始结束继续等待看见知道得到可以我们你们他们这里那里一个两个每个所有没有不同相同一起因为所以如果然后最后首先东西地方世界生活学习工作朋友家园平安快乐希望梦想勇气智慧探索行动选择成功重要特别简单自然美好山川大地城市街道历史文化知识语言文字问题方法结果过程目标路径地图调查记录标记符号内容信息关系中心边界远方回声消息重现通往过去未来'));
            const symbols = Array.from('0123456789+-=*/%#@&!?<>[]()');
            const randomHan = actual => {
                let char;
                do { const pool = Math.random() < 0.2 ? symbols : commonHan; char = pool[Math.floor(Math.random() * pool.length)]; }
                while (char === actual);
                return char;
            };
            const cells = chars.map(char => {
                if (/^[\n\r\u2028\u2029]$/u.test(char)) return document.createTextNode(char);
                const cell = document.createElement('span');
                cell.className = 'decode-char';
                cell.textContent = char;
                cell.setAttribute('aria-hidden', 'true');
                return cell;
            });
            clue.replaceChildren(...cells);
            const start = performance.now();
            let timer;
            // Keep the original accessible text stable while the visual glyphs change.
            clue.setAttribute('aria-label', original);
            function update() {
                const solved = Math.floor((performance.now() - start) / 200);
                let index = 0;
                chars.forEach((char, i) => { cells[i].textContent = /\s/u.test(char) ? char : (++index <= solved ? char : randomHan(char)); });
                if (solved >= total) {
                    clearInterval(timer);
                }
            }
            if (total) {
                timer = setInterval(update, 50);
                update();
            }
        }
    </script>
</body>
</html>
